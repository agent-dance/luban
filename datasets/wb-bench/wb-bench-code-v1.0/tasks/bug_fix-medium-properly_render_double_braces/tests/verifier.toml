schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''python -m pytest \
  tests/test_phystokens.py::PhysTokensTest::test_fstring_middle \
  tests/test_html.py::HtmlGoldTest::test_bug_1980 \
  tests/test_phystokens.py::PhysTokensTest::test_fstring_double_braces_roundtrip \
  tests/test_phystokens.py::PhysTokensTest::test_simple \
  -o addopts='' -q --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
