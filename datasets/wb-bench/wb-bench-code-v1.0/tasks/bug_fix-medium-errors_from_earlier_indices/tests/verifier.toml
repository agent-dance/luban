schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''env JSON_SCHEMA_TEST_SUITE=/workspace/json python -m pytest \
  jsonschema/tests/test_exceptions.py::TestBestMatch::test_anyOf_traversal_for_single_sibling_errors \
  jsonschema/tests/test_exceptions.py::TestBestMatch::test_anyOf_traversal_for_non_type_matching_sibling_errors \
  jsonschema/tests/test_exceptions.py::TestBestMatch::test_oneOf_traversal_for_single_sibling_errors \
  jsonschema/tests/test_exceptions.py::TestBestMatch::test_oneOf_traversal_for_non_type_matching_sibling_errors \
  jsonschema/tests/test_relevance.py::TestRelevanceKey \
  jsonschema/tests/test_relevance.py::TestBasicValidate::test_basic_string_validation \
  -v --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
