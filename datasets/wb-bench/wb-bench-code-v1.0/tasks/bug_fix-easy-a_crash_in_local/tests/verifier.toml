schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''python -m pytest \
  tests/test_local.py::test_local_del_swallows_type_error \
  tests/test_local.py::test_local_del_swallows_type_error_after_partial_iteration \
  tests/test_local_shutdown.py::test_local_del_cleans_seen_contexts_before_shutdown_type_error \
  -v --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
