schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''python -m pytest tests/test_number.py::test_metric tests/test_number.py::test_metric_is_exported_at_package_root -v --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
