schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''env PYTHONPATH=src python -m pytest \
    tests/test_unix.py::test_openbsd_user_runtime_dir_writable \
    'tests/test_unix.py::test_xdg_runtime_dir_unset_writable[openbsd-/tmp/run/user/1234]' \
    tests/test_unix.py::test_openbsd_user_runtime_dir_uses_tmp_run \
    tests/test_unix.py::test_openbsd_site_runtime_dir \
    -q --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
