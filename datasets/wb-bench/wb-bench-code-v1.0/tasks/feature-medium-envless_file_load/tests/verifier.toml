schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''python -m pytest -m "not integration" \
  tests/test_base.py::test_envless_load_file \
  tests/test_base.py::test_envless_load_file_does_not_apply_active_env_sections \
  tests/test_base.py::test_envless_load_file_ignores_env_section \
  tests/test_base.py::test_from_env_method \
  -q --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
