schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''python -m pytest \
    test/api/simple_test.py::test__api__parse_without_dialect_falls_back_to_ansi \
    test/api/simple_test.py::test__api__lint_without_dialect_falls_back_to_ansi \
    test/api/simple_test.py::test__api__parse_prefers_config_dialect_when_unspecified \
    test/api/simple_test.py::test__api__lint_string_without_violations \
    -v --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
