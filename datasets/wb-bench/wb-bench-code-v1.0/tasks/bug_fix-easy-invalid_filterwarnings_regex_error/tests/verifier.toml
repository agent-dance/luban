schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''python -m pytest \
  testing/test_warnings.py::TestDeprecationWarningsByDefault::test_invalid_regex_in_filterwarning \
  testing/test_warnings.py::TestDeprecationWarningsByDefault::test_invalid_message_regex_in_filterwarning \
  testing/test_warnings.py::test_parse_warning_filter_invalid_regex_raises_usageerror \
  testing/test_warnings.py::TestDeprecationWarningsByDefault::test_hidden_by_ini \
  -v --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
