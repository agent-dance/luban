schema_version = "workbuddy.code_lite.verifier.v1"
family = "pytest_injected"

[run]
cwd = "/workspace"
command = '''python -m pytest \
    tests/test_itsdangerous/test_serializer.py::TestSerializer::test_fallback_signers \
    tests/test_itsdangerous/test_serializer.py::TestSerializer::test_default_digest_method_matches_legacy_sha1 \
    tests/test_itsdangerous/test_serializer.py::TestSerializer::test_regression_basic_dumps \
    tests/test_fallback_utils.py::TestIterFallbackSigners \
  /tests/test_requires_test_changes.py -v --junitxml=/logs/verifier/results.xml > /logs/verifier/test_output.txt 2>&1'''
